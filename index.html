<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Ilan Esquenazi, estudiante de Seguridad Informática en Córdoba, Argentina. Soporte técnico, redes, Linux y fundamentos de ciberseguridad.">
<title>Ilan Esquenazi | Seguridad Informática &amp; IT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04070D;
  --bg-elevated: rgba(10, 16, 28, 0.74);
  --bg-card-hover: rgba(16, 26, 44, 0.88);
  --ink: #F1F5F9;
  --muted: #94A3B8;
  --dim: #64748B;
  --line: rgba(56, 189, 248, 0.16);
  --line-strong: rgba(0, 240, 255, 0.42);
  --cyan: #00F0FF;
  --sky: #38BDF8;
  --emerald: #10B981;
  --amber: #F59E0B;
  --nav-h: 68px;
  color-scheme: dark;
  box-sizing: border-box;
}

*, *::before, *::after {
  box-sizing: inherit;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-h) + 24px);
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

body {
  margin: 0;
  background-color: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.65 "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Fondo técnico: grilla + resplandor + red de nodos */
.cyber-grid {
  position: fixed;
  inset: 0;
  z-index: -3;
  pointer-events: none;
  background-image:
    radial-gradient(circle at 20% 15%, rgba(0, 240, 255, 0.08), transparent 42%),
    radial-gradient(circle at 82% 70%, rgba(56, 189, 248, 0.07), transparent 45%),
    linear-gradient(to right, rgba(56, 189, 248, 0.035) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(56, 189, 248, 0.035) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 44px 44px, 44px 44px;
}

#net-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -2;
  pointer-events: none;
}

.wrap {
  max-width: 58rem;
  margin: 0 auto;
  padding: 0 1.5rem;
}

h1, h2, h3 {
  font-family: "Space Grotesk", system-ui, sans-serif;
  line-height: 1.15;
  margin: 0;
}

a {
  color: var(--cyan);
  text-decoration: none;
}

a:focus-visible, button:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 3px;
  border-radius: 6px;
}

/* ================= BARRA SUPERIOR INTERACTIVA ================= */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: var(--nav-h);
  z-index: 100;
  background: rgba(4, 7, 13, 0.78);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}

.topbar.scrolled {
  background: rgba(4, 7, 13, 0.92);
  border-bottom-color: rgba(0, 240, 255, 0.28);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
}

.topbar-inner {
  max-width: 68rem;
  height: 100%;
  margin: 0 auto;
  padding: 0 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  font-family: "JetBrains Mono", monospace;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.brand-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 7px;
  background: rgba(0, 240, 255, 0.1);
  border: 1px solid var(--line-strong);
  color: var(--cyan);
  font-size: 0.8rem;
}

.brand span.cursor {
  color: var(--cyan);
  animation: blink 1.1s steps(2, start) infinite;
}

@keyframes blink {
  to { visibility: hidden; }
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  list-style: none;
  margin: 0;
  padding: 0;
}

.nav-links a {
  position: relative;
  display: inline-block;
  padding: 0.42rem 0.72rem;
  font-size: 0.88rem;
  font-weight: 500;
  color: var(--muted);
  border-radius: 6px;
  transition: color 0.2s ease, background 0.2s ease;
}

.nav-links a:hover {
  color: var(--ink);
  background: rgba(56, 189, 248, 0.08);
}

.nav-links a.active {
  color: var(--cyan);
  background: rgba(0, 240, 255, 0.09);
}

.nav-links a.active::after {
  content: "";
  position: absolute;
  left: 0.72rem;
  right: 0.72rem;
  bottom: 2px;
  height: 2px;
  background: var(--cyan);
  border-radius: 2px;
  box-shadow: 0 0 8px var(--cyan);
}

.nav-socials {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.social-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.45rem;
  padding: 0.42rem 0.78rem;
  border-radius: 8px;
  font-family: "JetBrains Mono", monospace;
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--ink);
  background: rgba(15, 23, 42, 0.75);
  border: 1px solid var(--line);
  cursor: pointer;
  transition: transform 0.18s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
}

.social-pill svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.social-pill:hover {
  transform: translateY(-1px);
  border-color: var(--line-strong);
  background: rgba(0, 240, 255, 0.1);
  box-shadow: 0 0 16px rgba(0, 240, 255, 0.16);
}

.social-pill.icon-only {
  padding: 0.46rem;
}

.menu-toggle {
  display: none;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 8px;
  background: rgba(15, 23, 42, 0.8);
  border: 1px solid var(--line);
  color: var(--ink);
  cursor: pointer;
}

.menu-toggle:hover {
  border-color: var(--line-strong);
  color: var(--cyan);
}

/* Cajón móvil */
.mobile-drawer {
  display: none;
  position: fixed;
  top: var(--nav-h);
  left: 0;
  right: 0;
  z-index: 99;
  background: rgba(6, 10, 19, 0.96);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--line-strong);
  padding: 1.25rem 1.5rem 1.5rem;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.75);
}

.mobile-drawer.open {
  display: block;
}

.mobile-nav-list {
  list-style: none;
  margin: 0 0 1.25rem;
  padding: 0;
  display: grid;
  gap: 0.35rem;
}

.mobile-nav-list a {
  display: block;
  padding: 0.65rem 0.85rem;
  border-radius: 8px;
  color: var(--ink);
  font-weight: 500;
  border: 1px solid transparent;
}

.mobile-nav-list a:hover, .mobile-nav-list a.active {
  background: rgba(0, 240, 255, 0.08);
  border-color: var(--line);
  color: var(--cyan);
}

.mobile-socials {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0.6rem;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
}

.mobile-socials .social-pill {
  justify-content: flex-start;
  padding: 0.65rem 0.9rem;
  font-size: 0.82rem;
}

@media (max-width: 880px) {
  .nav-links, .nav-socials {
    display: none;
  }
  .menu-toggle {
    display: inline-flex;
  }
}

/* ================= HERO ================= */
.hero {
  min-height: 78vh;
  display: flex;
  align-items: center;
  padding: calc(var(--nav-h) + 3.5rem) 0 3.5rem;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.35rem 0.85rem;
  border-radius: 99px;
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.32);
  font-family: "JetBrains Mono", monospace;
  font-size: 0.76rem;
  color: #6EE7B7;
  margin-bottom: 1.35rem;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--emerald);
  box-shadow: 0 0 10px var(--emerald);
  animation: pulse 2.2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.45; transform: scale(0.85); }
}

.hero h1 {
  font-weight: 700;
  font-size: clamp(2.75rem, 8vw, 4.85rem);
  letter-spacing: -0.035em;
  background: linear-gradient(135deg, #FFFFFF 35%, #BAE6FD 75%, #00F0FF 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.role {
  font-family: "Space Grotesk", sans-serif;
  font-weight: 600;
  font-size: clamp(1.15rem, 3vw, 1.5rem);
  color: var(--cyan);
  margin: 0.85rem 0 1.25rem;
}

.lead {
  max-width: 42rem;
  font-size: 1.08rem;
  color: var(--muted);
  margin: 0 0 2rem;
}

.hud-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1.5rem;
  padding: 0.9rem 1.15rem;
  border-radius: 10px;
  background: rgba(10, 16, 28, 0.65);
  border: 1px solid var(--line);
  font-family: "JetBrains Mono", monospace;
  font-size: 0.8rem;
  color: var(--muted);
}

.hud-strip span strong {
  color: var(--ink);
  font-weight: 500;
}

/* ================= SECCIONES & PANELES ================= */
section {
  padding: 3.25rem 0;
}

.section-head {
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}

.section-index {
  font-family: "JetBrains Mono", monospace;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--cyan);
}

h2 {
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.panel {
  position: relative;
  background: var(--bg-elevated);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1.6rem;
  transition: border-color 0.25s ease, background 0.25s ease;
}

.panel:hover {
  border-color: rgba(0, 240, 255, 0.32);
}

/* Esquinas técnicas tipo visor HUD */
.panel::before, .panel::after {
  content: "";
  position: absolute;
  width: 10px;
  height: 10px;
  pointer-events: none;
  border-color: var(--cyan);
  border-style: solid;
  opacity: 0.55;
}

.panel::before {
  top: -1px;
  left: -1px;
  border-width: 2px 0 0 2px;
  border-top-left-radius: 12px;
}

.panel::after {
  bottom: -1px;
  right: -1px;
  border-width: 0 2px 2px 0;
  border-bottom-right-radius: 12px;
}

.panel p {
  margin: 0;
  color: var(--muted);
}

.panel p strong {
  color: var(--ink);
  font-weight: 500;
}

/* ================= HABILIDADES (BENTO GRID) ================= */
.skills-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
}

.skill-card {
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1.3rem 1.4rem;
  transition: transform 0.2s ease, border-color 0.25s ease, background 0.25s ease;
}

.skill-card:hover {
  transform: translateY(-2px);
  border-color: var(--line-strong);
  background: var(--bg-card-hover);
}

.skill-card.full {
  grid-column: 1 / -1;
}

.skill-card h3 {
  font-family: "JetBrains Mono", monospace;
  font-size: 0.88rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--cyan);
  margin-bottom: 0.85rem;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
}

.tag {
  padding: 0.28rem 0.65rem;
  border-radius: 6px;
  font-size: 0.84rem;
  color: var(--ink);
  background: rgba(30, 41, 59, 0.65);
  border: 1px solid rgba(148, 163, 184, 0.18);
  transition: border-color 0.2s ease, color 0.2s ease;
}

.skill-card:hover .tag {
  border-color: rgba(56, 189, 248, 0.28);
}

@media (max-width: 42rem) {
  .skills-grid {
    grid-template-columns: 1fr;
  }
}

/* ================= EXPERIENCIA ================= */
.timeline {
  display: grid;
  gap: 1.25rem;
}

.job {
  position: relative;
  padding: 1.4rem 1.5rem 1.4rem 1.75rem;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-left: 3px solid var(--cyan);
  border-radius: 12px;
  transition: border-color 0.25s ease, background 0.25s ease;
}

.job:hover {
  border-color: var(--line-strong);
  background: var(--bg-card-hover);
}

.job-top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 0.5rem 1rem;
  margin-bottom: 0.35rem;
}

.job h3 {
  font-size: 1.18rem;
  font-weight: 700;
  color: var(--ink);
}

.job-date {
  font-family: "JetBrains Mono", monospace;
  font-size: 0.78rem;
  color: var(--cyan);
  background: rgba(0, 240, 255, 0.08);
  border: 1px solid rgba(0, 240, 255, 0.22);
  padding: 0.2rem 0.6rem;
  border-radius: 6px;
}

.job-company {
  font-weight: 500;
  font-size: 0.95rem;
  color: var(--sky);
  margin: 0 0 0.85rem;
}

.job ul {
  margin: 0;
  padding-left: 1.15rem;
  color: var(--muted);
}

.job li {
  margin-bottom: 0.4rem;
}

.job li:last-child {
  margin-bottom: 0;
}

/* ================= PROYECTOS ================= */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
}

.project {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 1.45rem;
  transition: transform 0.2s ease, border-color 0.25s ease, background 0.25s ease;
}

.project:hover {
  transform: translateY(-2px);
  border-color: var(--line-strong);
  background: var(--bg-card-hover);
}

.project-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 0.75rem;
  margin-bottom: 0.75rem;
}

.project h3 {
  font-size: 1.15rem;
  font-weight: 700;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-family: "JetBrains Mono", monospace;
  font-size: 0.72rem;
  font-weight: 500;
  padding: 0.22rem 0.6rem;
  border: 1px solid rgba(245, 158, 11, 0.4);
  background: rgba(245, 158, 11, 0.1);
  color: #FCD34D;
  border-radius: 99px;
  white-space: nowrap;
}

.project p {
  margin: 0 0 1.1rem;
  color: var(--muted);
  font-size: 0.96rem;
}

.tech-list {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.tech-badge {
  font-family: "JetBrains Mono", monospace;
  font-size: 0.76rem;
  color: var(--cyan);
  background: rgba(0, 240, 255, 0.07);
  border: 1px solid rgba(0, 240, 255, 0.2);
  padding: 0.2rem 0.55rem;
  border-radius: 5px;
}

@media (max-width: 44rem) {
  .projects-grid {
    grid-template-columns: 1fr;
  }
}

/* ================= EDUCACIÓN ================= */
.edu-list {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 0.85rem;
}

.edu-item {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 0.5rem 1rem;
  padding: 1.15rem 1.4rem;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: 12px;
}

.edu-item strong {
  display: block;
  font-family: "Space Grotesk", sans-serif;
  font-size: 1.08rem;
  color: var(--ink);
}

.edu-item span {
  color: var(--muted);
  font-size: 0.92rem;
}

.edu-period {
  font-family: "JetBrains Mono", monospace;
  font-size: 0.78rem;
  color: var(--sky);
}

/* ================= CONTACTO ================= */
.contact-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.9rem;
}

.contact-card {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 1.1rem 1.2rem;
  background: var(--bg-elevated);
  border: 1px solid var(--line);
  border-radius: 12px;
  color: var(--ink);
  transition: transform 0.2s ease, border-color 0.25s ease, background 0.25s ease;
}

.contact-card:hover {
  transform: translateY(-2px);
  border-color: var(--line-strong);
  background: var(--bg-card-hover);
}

.contact-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 9px;
  background: rgba(0, 240, 255, 0.08);
  border: 1px solid rgba(0, 240, 255, 0.22);
  flex-shrink: 0;
}

.contact-icon svg {
  width: 20px;
  height: 20px;
}

.contact-meta {
  min-width: 0;
}

.contact-label {
  display: block;
  font-family: "JetBrains Mono", monospace;
  font-size: 0.72rem;
  text-transform: uppercase;
  color: var(--cyan);
}

.contact-value {
  display: block;
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

@media (max-width: 48rem) {
  .contact-grid {
    grid-template-columns: 1fr;
  }
}

footer {
  padding: 2.5rem 0 3.5rem;
  border-top: 1px solid var(--line);
